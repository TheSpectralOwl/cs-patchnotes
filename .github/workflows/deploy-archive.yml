name: Deploy Archive API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-archive.yml"
      - "docker-compose.archive.yml"
      - "package.json"
      - "package-lock.json"
      - "pipeline/**"
      - "packages/archive-api/**"
      - "tools/activate-content.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            archive_dir="$HOME/cs-patchnotes-archive"
            content_repo="$HOME/cs-patchnotes-content-repo"
            revision_root="$HOME/cs-patchnotes-content-revisions"
            if [ ! -d "$archive_dir" ]; then
              git clone --branch main https://github.com/TheSpectralOwl/cs-patchnotes.git "$archive_dir"
            elif [ ! -d "$archive_dir/.git" ]; then
              git -C "$archive_dir" init --quiet
              git -C "$archive_dir" remote add origin https://github.com/TheSpectralOwl/cs-patchnotes.git
              git -C "$archive_dir" fetch --quiet origin main
              git -C "$archive_dir" switch --quiet --track -c main origin/main
            else
              git -C "$archive_dir" fetch --quiet origin main
              git -C "$archive_dir" switch main
              git -C "$archive_dir" pull --ff-only origin main
            fi
            if [ ! -d "$content_repo/.git" ]; then
              git clone --branch main https://github.com/TheSpectralOwl/cs-patchnotes-content.git "$content_repo"
            else
              git -C "$content_repo" fetch --quiet origin main
            fi
            test -f "$archive_dir/.env"
            if ! command -v node >/dev/null 2>&1 && [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            command -v node >/dev/null 2>&1 || {
              echo "Node.js is unavailable to the deployment user." >&2
              exit 127
            }
            mkdir -p "$revision_root/worktrees"
            if [ ! -f "$revision_root/active" ]; then
              sha="$(git -C "$content_repo" rev-parse origin/main)"
              candidate="$revision_root/worktrees/$sha"
              git -C "$content_repo" worktree add --detach "$candidate" "$sha"
              CONTENT_DIR="$candidate" node "$archive_dir/pipeline/verify.cjs"
              marker="$revision_root/.active-initial"
              printf '%s\n' "$sha" > "$marker"
              mv "$marker" "$revision_root/active"
            fi
            sha="$(tr -d '\n' < "$revision_root/active")"
            candidate="$revision_root/worktrees/$sha"
            test -d "$candidate"
            CONTENT_DIR="$candidate" node "$archive_dir/pipeline/verify.cjs"
            cd "$archive_dir"
            CONTENT_REVISION_ROOT="$revision_root" docker compose -f docker-compose.archive.yml --profile vps up --build -d
            CONTENT_SHA="$sha" node -e '
              const expected = process.env.CONTENT_SHA;
              fetch("http://127.0.0.1:3001/health")
                .then(async (response) => {
                  if (!response.ok) throw new Error(`health request failed: ${response.status}`);
                  const health = await response.json();
                  if (health?.ok !== true || health.content_sha !== expected) throw new Error("deployed API did not confirm the active content SHA");
                })
                .catch((error) => { console.error(error.message); process.exitCode = 1; });
            '
