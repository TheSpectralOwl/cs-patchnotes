name: cs-patchnotes-archive

services:
  archive-api:
    image: ghcr.io/thespectralowl/cs-patchnotes-archive-api:latest
    build:
      context: .
      dockerfile: packages/archive-api/Dockerfile
    environment:
      CONTENT_REVISION_ROOT: /content-revisions
      PORT: 3001
      RELOAD_TOKEN: ${RELOAD_TOKEN:?set RELOAD_TOKEN in .env}
    volumes:
      - ${CONTENT_REVISION_ROOT:?set CONTENT_REVISION_ROOT to the host revision root}:/content-revisions:ro
    ports:
      - "127.0.0.1:3001:3001"
    networks: [internal]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [archive-api]
    networks: [internal]
    restart: unless-stopped
    profiles: [vps]

networks:
  internal:
    driver: bridge
